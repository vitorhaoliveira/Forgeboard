name: Publish to npm

# Runs when a version tag is pushed, e.g. `git tag v1.7.0 && git push origin v1.7.0`.
on:
  push:
    tags: ["v*"]

# Uses npm Trusted Publishing: no token. Configure it once on npmjs.com
# (package → Settings → Trusted Publisher → GitHub Actions → this repo, publish.yml).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match packages/cli/package.json ($VERSION)"; exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm --filter forgeboard build
      - name: Publish
        working-directory: packages/cli
        # Trusted Publishing also adds provenance automatically.
        run: npm publish --access public
