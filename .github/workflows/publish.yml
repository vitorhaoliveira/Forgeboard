name: Publish to npm

# Runs when a version tag is pushed, e.g. `git tag v1.7.0 && git push origin v1.7.0`.
# Publishes to npm, then creates the GitHub release for the tag.
on:
  push:
    tags: ["v*"]

# Uses npm Trusted Publishing: no token. Configure it once on npmjs.com
# (package → Settings → Trusted Publisher → GitHub Actions → this repo, publish.yml).
# contents: write lets the workflow create the GitHub release.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match packages/cli/package.json ($VERSION)"; exit 1
          fi
      - name: Skip if this version is already on npm
        id: exists
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "forgeboard@$VERSION" version > /dev/null 2>&1; then
            echo "forgeboard@$VERSION is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.published != 'true'
        run: pnpm typecheck
      - if: steps.exists.outputs.published != 'true'
        run: pnpm --filter forgeboard build
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        working-directory: packages/cli
        # Trusted Publishing also adds provenance automatically.
        run: npm publish --access public
      # Runs even when npm already has the version, so a re-run still creates
      # the release. Notes come from the version's CHANGELOG.md section.
      # Skips if the release exists (e.g. written by hand).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
          else
            node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/title" "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$(cat "$RUNNER_TEMP/title")" --notes-file "$RUNNER_TEMP/notes.md"
          fi
