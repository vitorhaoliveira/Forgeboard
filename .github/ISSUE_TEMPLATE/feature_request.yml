name: Feature request
description: An idea to make Forgeboard better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered instead?
