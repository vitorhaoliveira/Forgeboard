name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a workspace with…
        2. Run the task "…"
        3. …
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Local app (pnpm dev)
        - Public demo
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Claude Code
        - Mock (no AI)
        - Not related to agents
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 22.13, Forgeboard v1.6.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server output, browser console, or a screenshot. Remove anything private first.
